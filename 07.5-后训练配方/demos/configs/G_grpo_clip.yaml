experiment:
  group: "G_grpo_clip"
  description: "GRPO + clip-higher only（隔离 DAPO 单个修复的效果）"

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"

data:
  task: "gsm8k"
  num_samples: 500

grpo:
  lr: 1e-6
  bs: 2
  grad_accum: 8
  num_generations: 8
  max_completion: 512
  max_prompt: 512
  temperature: 0.9
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28     # 只改 clip 上界，其他不动
  scale_rewards: true    # 保留 std 归一化
  max_steps: 500
