experiment:
  group: "D_sft_grpo"
  description: "先 SFT 冷启动，再 GRPO"

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  sft_checkpoint: "results/B_sft_seed42/final"  # 先跑 B 组

data:
  task: "gsm8k"
  num_samples: 500

grpo:
  lr: 1e-6
  bs: 2
  grad_accum: 8
  num_generations: 8
  max_completion: 512
  max_prompt: 512
  temperature: 0.9
  beta: 0.0
  epsilon: 0.2
  scale_rewards: true
  max_steps: 500
