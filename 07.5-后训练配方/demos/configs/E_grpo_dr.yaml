experiment:
  group: "E_grpo_dr"
  description: "GRPO + Dr. GRPO（去 std 归一化）"

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"

data:
  task: "gsm8k"
  num_samples: 500

grpo:
  lr: 1e-6
  bs: 2
  grad_accum: 8
  num_generations: 8
  max_completion: 512
  max_prompt: 512
  temperature: 0.9
  beta: 0.0
  epsilon: 0.2
  scale_rewards: false   # Dr. GRPO：(r - mean)，不除 std
  max_steps: 500
